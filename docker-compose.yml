version: "3.9"
# Optional Postgres setup. By default the project uses SQLite (file:./dev.db)
# so you do not need Docker. To switch to Postgres, change DATABASE_URL in .env to
# postgresql://rpg:rpg@localhost:5432/rpg and run `docker compose up -d`, then
# adjust prisma/schema.prisma datasource provider to "postgresql".
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rpg
      POSTGRES_PASSWORD: rpg
      POSTGRES_DB: rpg
    ports:
      - "5432:5432"
    volumes:
      - rpg_pg:/var/lib/postgresql/data
volumes:
  rpg_pg: {}
